[package]
name = "vault-lab"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"

[dependencies]
crypto = { path = "vendor/crypto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
rpassword = "7"
zeroize = "1"
subtle = "2"
hex = "0.4"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
